name: WPF Build Artifact

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'

jobs:
  build-wpf:
    runs-on: windows-latest
    
    strategy:
      matrix:
        include:
          - runtime: win-x64
            platform: x64
          - runtime: win-x86
            platform: x86
          - runtime: win-arm64
            platform: ARM64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Build and publish
      run: |
        # 为每个运行时创建独立的输出目录
        $outputDir = "./dist/${{ matrix.runtime }}"
        Remove-Item -Recurse -Force $outputDir -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path $outputDir -Force
        
        Write-Host "正在构建 ${{ matrix.runtime }} 版本..."
        
        # 发布为单文件可执行程序
        dotnet publish pdfdir-win.csproj `
          -c ${{ env.CONFIGURATION }} `
          -r ${{ matrix.runtime }} `
          -o $outputDir `
          --self-contained true `
          /p:PublishSingleFile=true `
          /p:UseAppHost=true `
          /p:Platform=${{ matrix.platform }}
        
        # 检查是否成功生成文件
        $exeFiles = Get-ChildItem $outputDir -Filter *.exe
        if ($exeFiles.Count -eq 0) {
          Write-Host "警告：未找到 .exe 文件"
          Get-ChildItem $outputDir
        } else {
          Write-Host "生成文件: $($exeFiles.Name)"
        }
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pdfdir-win-${{ matrix.runtime }}
        path: ./dist/${{ matrix.runtime }}/
        retention-days: 30